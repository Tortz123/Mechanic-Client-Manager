<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars</title>
    <script type="module" src="cars.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <h1 id="client-name">Cars Page</h1>
        <a href="clients.html">Back to Clients</a>
        <p id="error-message" role="alert"></p>

        <h2>Cars</h2>
        <table id="cars-table">
            <tr>
                <th>Brand</th>
                <th>Model</th>
                <th>Year</th>
                <th>VIN</th>
                <th>Delete</th>
            </tr>
        </table>

        <h2>Add New Car</h2>
        <form id="newCar-form">
            <div>
                <input type="text" name="brand" id="brand-input" placeholder="Brand">
            </div>
            <div>
                <input type="text" name="model" id="model-input" placeholder="Model">
            </div>
            <div>
                <input type="number" name="year" id="year-input" placeholder="Year" min="0">
            </div>
            <div>
                <input type="text" name="vin" id="vin-input" placeholder="VIN">
            </div>
            <button type="submit" onclick="window.location.reload();">Add Car</button>
        </form>

    </div>
    
</body>
</html>
